name: cleanit
description: Free hostel room cleaning app for college students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ── Firebase / FCM ──
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # ── QR Code ──
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # ── Camera & Image ──
  image_picker: ^1.0.7

  # ── Crypto (HMAC for QR signing) ──
  crypto: ^3.0.3

  # ── HTTP (for MongoDB backend API) ──
  http: ^1.2.0

  # ── Secure Storage (JWT token) ──
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # ── Utilities ──
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
